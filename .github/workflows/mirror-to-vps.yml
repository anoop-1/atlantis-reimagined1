# Keep the VPS copy of atlantisndt.com current on every push to main.
#
# Vercel is the live host. This workflow exists so the VPS is a *warm* standby
# rather than a stale one: on 2026-08-01 Vercel returned 402 DEPLOYMENT_DISABLED
# and the site was down, and the only reason recovery was quick is that a build
# happened to be reproducible. A standby nobody updates is not a standby.
#
# It does not change where traffic goes. Cutting over is still a deliberate act
# (DNS, or an edge failover rule) — this only guarantees there is something
# correct and current to cut over to.
name: Mirror to VPS standby

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mirror-to-vps
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build (vite + prerender + schema injection)
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
        run: bun run build

      - name: Sanity-check the build before shipping it
        run: |
          pages=$(find dist -name index.html | wc -l)
          echo "prerendered pages: $pages"
          # A collapsed build (SPA shell only) must never overwrite a good standby.
          if [ "$pages" -lt 4000 ]; then
            echo "::error::only $pages prerendered pages — refusing to mirror a partial build"
            exit 1
          fi
          test -s dist/sitemap.xml || { echo "::error::sitemap.xml missing or empty"; exit 1; }
          grep -q 'rel="canonical"' dist/erp/index.html || { echo "::error::/erp lost its canonical"; exit 1; }

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync dist to the VPS docroot
        # No --delete: the standby is additive (CLAUDE.md additive-only rule), and
        # keeping superseded hashed assets around means an in-flight page load
        # during a cutover does not 404 on its own chunks.
        run: |
          rsync -az --checksum \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/"

      - name: Reload nginx and confirm the standby serves
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'chown -R www-data:www-data '"${{ secrets.VPS_PATH }}"' && nginx -t && systemctl reload nginx && curl -sf -o /dev/null -w "standby /erp -> %{http_code}\n" --resolve atlantisndt.com:443:127.0.0.1 https://atlantisndt.com/erp'
