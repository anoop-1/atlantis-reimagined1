# Deploy atlantisndt.com to the VPS on every push to main.
#
# The VPS is now the primary host (migrated off Vercel 2026-09-24 — the
# Vercel Hobby team kept hitting fair-use "Account is blocked" failures,
# driven by this site's scale sharing one quota with 38 separate satellite
# projects that stay on Vercel). This workflow replaces the old
# mirror-to-vps.yml (deleted 2026-08-04 when Vercel was primary and this was
# just a standby) — same build+rsync foundation, now with a two-stage
# additive asset sync + atomic release swap so a bad build can never leave
# the live site in a partially-written state, and instant rollback is just
# re-pointing a symlink.
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build (vite + prerender + full SEO release pipeline)
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
        run: bun run build

      - name: Sanity-check the build before shipping it
        run: |
          pages=$(find dist -name index.html | wc -l)
          echo "prerendered pages: $pages"
          # A collapsed build (SPA shell only) must never go live. Floor raised
          # from the old workflow's 4000 to match current real scale (~7,840).
          if [ "$pages" -lt 7000 ]; then
            echo "::error::only $pages prerendered pages — refusing to deploy a partial build"
            exit 1
          fi
          test -s dist/sitemap.xml || { echo "::error::sitemap.xml missing or empty"; exit 1; }
          grep -q 'rel="canonical"' dist/erp/index.html || { echo "::error::/erp lost its canonical"; exit 1; }

      - name: Preflight (deeper SEO/compliance gate)
        run: node scripts/preflight.mjs --strict

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Non-fatal: the runner IP is not always able to reach the host for a
          # keyscan (rate limiting and intermittent refusals have both been
          # seen), and the sync steps set StrictHostKeyChecking=no anyway.
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || \
            echo "keyscan unavailable — proceeding with StrictHostKeyChecking=no"

      - name: Sync shared assets (additive, no --delete)
        # Hashed build assets (dist/assets/) live in one persistent directory
        # shared across every release, never pruned by this step, so an
        # in-flight page load across a deploy never 404s its own chunk.
        run: |
          rsync -az --checksum \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            dist/assets/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/_shared/assets/"

      - name: Sync this release's HTML/route tree
        run: |
          REL="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "REL=$REL" >> "$GITHUB_ENV"
          rsync -az --checksum --exclude=assets/ \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/$REL/"

      - name: Atomic swap + reload + verify + prune old releases
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            REL="'"$REL"'"
            BASE="${{ secrets.VPS_PATH }}"
            ln -sfn "$BASE/_shared/assets" "$BASE/$REL/assets"
            chown -R www-data:www-data "$BASE/$REL"
            ln -sfn "$BASE/$REL" "$BASE/../atlantisndt.com-tmp"
            mv -T "$BASE/../atlantisndt.com-tmp" /var/www/atlantisndt.com
            nginx -t && systemctl reload nginx
            curl -sf -o /dev/null -w "live /erp -> %{http_code}\n" --resolve atlantisndt.com:443:127.0.0.1 https://atlantisndt.com/erp
            ls -1dt "$BASE"/2*/ | tail -n +6 | xargs -r rm -rf
            echo "deployed release: $REL"
          '
