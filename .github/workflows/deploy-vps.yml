name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Write build env (.env.local)
        run: |
          cat > .env.local <<EOF
          VITE_ADMIN_EMAIL=${{ secrets.VITE_ADMIN_EMAIL }}
          VITE_ADMIN_PASSWORD=${{ secrets.VITE_ADMIN_PASSWORD }}
          VITE_EMAILJS_SERVICE_ID=${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID=${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY=${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          EOF

      - name: Regenerate sitemaps (non-fatal)
        run: npm run sitemaps || echo "sitemap gen skipped"

      - name: Build (vite + prerender)
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "dist/index.html missing — aborting deploy"; exit 1; }
          echo "dist files: $(find dist -name index.html | wc -l)"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Backup live webroot (hardlink, space-cheap) + prune old
        run: |
          ssh -i ~/.ssh/id_rsa "$VPS_USER@$VPS_HOST" "set -e; \
            if [ -d '$VPS_PATH' ]; then cp -al '$VPS_PATH' '${VPS_PATH}.autobak.'\$(date +%Y%m%d_%H%M%S) || true; fi; \
            ls -dt ${VPS_PATH}.autobak.* 2>/dev/null | tail -n +4 | xargs -r rm -rf; \
            mkdir -p '$VPS_PATH'"

      - name: Deploy dist to VPS (additive, no --delete)
        run: |
          rsync -az --no-perms --no-owner --no-group --omit-dir-times \
            -e "ssh -i ~/.ssh/id_rsa" dist/ "$VPS_USER@$VPS_HOST:$VPS_PATH/"

      - name: Reload nginx
        run: |
          ssh -i ~/.ssh/id_rsa "$VPS_USER@$VPS_HOST" "nginx -t && systemctl reload nginx && echo reloaded"
